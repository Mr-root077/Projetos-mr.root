```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubo Mágico 3D</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: radial-gradient(circle at center, #252525, #080808);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

h1 {
    margin-bottom: 25px;
    font-size: 32px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.scene {
    width: 300px;
    height: 300px;
    perspective: 900px;
    cursor: grab;
}

.scene:active {
    cursor: grabbing;
}

.cube {
    width: 180px;
    height: 180px;
    position: relative;
    margin: 60px auto;
    transform-style: preserve-3d;
    transform: rotateX(-25deg) rotateY(-35deg);
    transition: transform 0.15s ease;
}

.face {
    position: absolute;
    width: 180px;
    height: 180px;
    padding: 4px;
    background: #111;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4px;
    border: 3px solid #000;
    backface-visibility: visible;
}

.sticker {
    border-radius: 5px;
    border: 2px solid #111;
    box-shadow:
        inset 0 0 3px rgba(255,255,255,.5),
        0 0 2px rgba(0,0,0,.8);
}

/* Cores tradicionais */

.white {
    background: #ffffff;
}

.yellow {
    background: #ffd900;
}

.red {
    background: #e21b23;
}

.orange {
    background: #ff7900;
}

.blue {
    background: #0057ff;
}

.green {
    background: #00a83b;
}

/* Posicionamento das faces */

.front {
    transform: translateZ(90px);
}

.back {
    transform: rotateY(180deg) translateZ(90px);
}

.right {
    transform: rotateY(90deg) translateZ(90px);
}

.left {
    transform: rotateY(-90deg) translateZ(90px);
}

.top {
    transform: rotateX(90deg) translateZ(90px);
}

.bottom {
    transform: rotateX(-90deg) translateZ(90px);
}

/* Botões */

.controls {
    display: flex;
    gap: 12px;
    margin-top: 25px;
}

button {
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    background: #ffffff;
    color: #111;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    background: #ddd;
}

.info {
    margin-top: 18px;
    color: #aaa;
    font-size: 14px;
    text-align: center;
}

@media (max-width: 500px) {
    .scene {
        transform: scale(.8);
    }

    h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<h1>🧊 Cubo Mágico</h1>

<div class="scene" id="scene">

    <div class="cube" id="cube">

        <!-- FRENTE -->
        <div class="face front">
            <div class="sticker green"></div>
            <div class="sticker green"></div>
            <div class="sticker green"></div>
            <div class="sticker green"></div>
            <div class="sticker green"></div>
            <div class="sticker green"></div>
            <div class="sticker green"></div>
            <div class="sticker green"></div>
            <div class="sticker green"></div>
        </div>

        <!-- TRÁS -->
        <div class="face back">
            <div class="sticker blue"></div>
            <div class="sticker blue"></div>
            <div class="sticker blue"></div>
            <div class="sticker blue"></div>
            <div class="sticker blue"></div>
            <div class="sticker blue"></div>
            <div class="sticker blue"></div>
            <div class="sticker blue"></div>
            <div class="sticker blue"></div>
        </div>

        <!-- DIREITA -->
        <div class="face right">
            <div class="sticker red"></div>
            <div class="sticker red"></div>
            <div class="sticker red"></div>
            <div class="sticker red"></div>
            <div class="sticker red"></div>
            <div class="sticker red"></div>
            <div class="sticker red"></div>
            <div class="sticker red"></div>
            <div class="sticker red"></div>
        </div>

        <!-- ESQUERDA -->
        <div class="face left">
            <div class="sticker orange"></div>
            <div class="sticker orange"></div>
            <div class="sticker orange"></div>
            <div class="sticker orange"></div>
            <div class="sticker orange"></div>
            <div class="sticker orange"></div>
            <div class="sticker orange"></div>
            <div class="sticker orange"></div>
            <div class="sticker orange"></div>
        </div>

        <!-- CIMA -->
        <div class="face top">
            <div class="sticker white"></div>
            <div class="sticker white"></div>
            <div class="sticker white"></div>
            <div class="sticker white"></div>
            <div class="sticker white"></div>
            <div class="sticker white"></div>
            <div class="sticker white"></div>
            <div class="sticker white"></div>
            <div class="sticker white"></div>
        </div>

        <!-- BAIXO -->
        <div class="face bottom">
            <div class="sticker yellow"></div>
            <div class="sticker yellow"></div>
            <div class="sticker yellow"></div>
            <div class="sticker yellow"></div>
            <div class="sticker yellow"></div>
            <div class="sticker yellow"></div>
            <div class="sticker yellow"></div>
            <div class="sticker yellow"></div>
            <div class="sticker yellow"></div>
        </div>

    </div>
</div>

<div class="controls">
    <button onclick="embaralhar()">🔀 Embaralhar</button>
    <button onclick="resetar()">🔄 Resetar</button>
</div>

<div class="info">
    🖱️ Arraste com o mouse para girar o cubo
</div>

<script>

const cube = document.getElementById("cube");
const scene = document.getElementById("scene");

let rotX = -25;
let rotY = -35;

let mouseDown = false;
let lastX = 0;
let lastY = 0;

/* =========================
   GIRAR COM O MOUSE
========================= */

scene.addEventListener("mousedown", (e) => {
    mouseDown = true;
    lastX = e.clientX;
    lastY = e.clientY;
});

document.addEventListener("mouseup", () => {
    mouseDown = false;
});

document.addEventListener("mousemove", (e) => {

    if (!mouseDown) return;

    const deltaX = e.clientX - lastX;
    const deltaY = e.clientY - lastY;

    rotY += deltaX * 0.6;
    rotX -= deltaY * 0.6;

    atualizarCubo();

    lastX = e.clientX;
    lastY = e.clientY;
});

/* =========================
   CONTROLE TOUCH
========================= */

scene.addEventListener("touchstart", (e) => {

    const touch = e.touches[0];

    lastX = touch.clientX;
    lastY = touch.clientY;

}, { passive: true });

scene.addEventListener("touchmove", (e) => {

    const touch = e.touches[0];

    const deltaX = touch.clientX - lastX;
    const deltaY = touch.clientY - lastY;

    rotY += deltaX * 0.7;
    rotX -= deltaY * 0.7;

    atualizarCubo();

    lastX = touch.clientX;
    lastY = touch.clientY;

}, { passive: true });

/* =========================
   ATUALIZAR CUBO
========================= */

function atualizarCubo() {

    cube.style.transform =
        `rotateX(${rotX}deg) rotateY(${rotY}deg)`;

}

/* =========================
   RESETAR
========================= */

function resetar() {

    rotX = -25;
    rotY = -35;

    atualizarCubo();
}

/* =========================
   EMBARALHAR
========================= */

function embaralhar() {

    let movimentos = 20;

    let i = 0;

    const intervalo = setInterval(() => {

        rotX += (Math.random() - 0.5) * 100;
        rotY += (Math.random() - 0.5) * 100;

        atualizarCubo();

        i++;

        if (i >= movimentos) {
            clearInterval(intervalo);
        }

    }, 120);
}

</script>

</body>
</html>
